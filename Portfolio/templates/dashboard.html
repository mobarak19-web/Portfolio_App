{% extends 'base.html' %}
{% block content %}
<h2>Admin Dashboard - Contact Messages</h2>
<div class="card p-4 mt-3 shadow-sm">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Message</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            {% for msg in messages %}
            <tr>
                <td>{{ msg.name }}</td>
                <td>{{ msg.email }}</td>
                <td>{{ msg.subject }}</td>
                <td>{{ msg.message }}</td>
                <td>{{ msg.created_at }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">No messages received yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
