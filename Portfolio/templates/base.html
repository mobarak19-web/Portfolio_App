<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">My Portfolio</a>
            <div>
                <a class="btn btn-outline-light btn-sm" href="{% url 'resume' %}">Resume</a>
                {% if user.is_authenticated %}
                    <a class="btn btn-outline-warning btn-sm" href="{% url 'dashboard' %}">Dashboard</a>
                    <a class="btn btn-outline-danger btn-sm" href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a class="btn btn-outline-primary btn-sm" href="{% url 'login' %}">Login</a>
                    <a class="btn btn-outline-success btn-sm" href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %} {% endblock %}
    </div>
</body>
</html>
